name: n2d_tracking
description: "Need2Done Helper Agent Tracking Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^9.2.2
  geolocator: ^14.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1
  app_links: ^6.4.0
  flutter_dotenv: ^5.2.1       # .env file loader for API keys
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.5

# ==========================================
# App Icon Config (Android & iOS)
# Run: dart run flutter_launcher_icons
# ==========================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A111E"
  adaptive_icon_foreground: "assets/brand_logo.png"

# ==========================================
# Splash Screen Config (Android & iOS)
# Run: dart run flutter_native_splash:create
# ==========================================
flutter_native_splash:
  color: "#0A111E"                       # Dark navy background
  color_dark: "#0A111E"
  image: assets/brand_logo.png           # Centered logo on splash
  android: true
  ios: true
  android_12:
    image: assets/brand_logo.png
    icon_background_color: "#0A111E"
    color: "#0A111E"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/brand_logo.png
    - .env                               # Load API keys at runtime
