<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Need2Done — Secure Payment</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root {
      --primary: #3399cc; /* Razorpay Blue */
      --primary-hover: #267fa8;
      --bg: #f5f8fa;
      --card-bg: #ffffff;
      --text: #1d252c;
      --text-muted: #5e6c79;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .payment-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: white;
    }

    .brand-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text);
    }

    .brand-text span {
      color: var(--primary);
    }

    .amount-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .amount-val {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      margin-bottom: 4px;
    }

    .amount-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .order-details {
      text-align: left;
      font-size: 0.9rem;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .detail-val {
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(51, 153, 204, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 2px solid white;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="payment-container">
    <div class="brand">
      <div class="brand-logo">N2D</div>
      <div class="brand-text">Need2Done <span>Payment</span></div>
    </div>

    <div class="amount-box">
      <div class="amount-val" id="amountVal">₹0.00</div>
      <div class="amount-label">Payment Amount</div>
    </div>

    <div class="order-details">
      <div class="detail-row">
        <span class="detail-label">Merchant</span>
        <span class="detail-val">Need2Done Services</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Order ID</span>
        <span class="detail-val" id="orderIdVal">-</span>
      </div>
    </div>

    <button class="btn btn-primary" id="payBtn" onclick="initiatePayment()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Pay Securely</span>
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId') || '';
    const amount = parseFloat(urlParams.get('amount')) || 0;
    
    // Default bot phone for fallback
    let botPhone = '15556349916'; 

    if(orderId) {
        document.getElementById('orderIdVal').innerText = orderId;
    }
    if(amount > 0) {
        document.getElementById('amountVal').innerText = `₹${amount.toFixed(2)}`;
        document.getElementById('btnText').innerText = `Pay ₹${amount.toFixed(2)}`;
    }

    // Fetch products to retrieve botPhone dynamically
    async function loadBotConfig() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        if (data.success && data.bot_phone) {
          botPhone = data.bot_phone;
        }
      } catch (err) {
        console.error('Failed to load bot phone:', err);
      }
    }
    loadBotConfig();

    async function initiatePayment() {
      if (!orderId || amount <= 0) {
        alert('Invalid order details. Cannot initiate payment.');
        return;
      }

      const payBtn = document.getElementById('payBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      payBtn.disabled = true;
      spinner.style.display = 'block';
      btnText.innerText = 'Processing...';

      try {
        // 1. Create order on backend
        const response = await fetch('/api/payments/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            amount: amount, 
            orderId: orderId,
            customerName: 'Guest User',
            customerPhone: '9999999999'
          })
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || 'Failed to create payment order');
        }

        // 2. Open Razorpay Checkout
        const options = {
          key: data.keyId,
          amount: data.amount,
          currency: data.currency,
          name: "Need2Done",
          description: "Service Payment",
          order_id: data.razorpayOrderId,
          handler: async function (response) {
            try {
              // 3. Verify payment on backend
              const verifyRes = await fetch('/api/payments/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature,
                  orderId: orderId
                })
              });

              const verifyData = await verifyRes.json();

              if (verifyData.success) {
                // Success: Redirect to WhatsApp bot
                window.location.href = `https://wa.me/${botPhone}?text=PAY_SUCCESS_${orderId}`;
              } else {
                alert('Payment verification failed. Please contact support.');
                window.location.href = `https://wa.me/${botPhone}?text=PAY_FAILED_${orderId}`;
              }
            } catch (err) {
              console.error('Verification Error:', err);
              alert('An error occurred while verifying the payment.');
              window.location.href = `https://wa.me/${botPhone}?text=PAY_FAILED_${orderId}`;
            }
          },
          prefill: {
            name: "Guest User",
            contact: "9999999999"
          },
          theme: {
            color: "#3399cc"
          },
          modal: {
            ondismiss: function () {
              // Reset button when user closes modal
              payBtn.disabled = false;
              spinner.style.display = 'none';
              btnText.innerText = `Pay ₹${amount.toFixed(2)}`;
            }
          }
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response){
           console.error('Payment Failed:', response.error);
        });
        rzp.open();

      } catch (err) {
        console.error('Payment Error:', err);
        alert(err.message || 'Something went wrong while initiating payment.');
        payBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.innerText = `Pay ₹${amount.toFixed(2)}`;
      }
    }
  </script>
</body>
</html>
