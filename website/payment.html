<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Need2Done — Razorpay Payment Gateway Simulator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root {
      --primary: #3399cc; /* Razorpay Blue */
      --primary-hover: #267fa8;
      --bg: #f5f8fa;
      --card-bg: #ffffff;
      --text: #1d252c;
      --text-muted: #5e6c79;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .payment-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: white;
    }

    .brand-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text);
    }

    .brand-text span {
      color: var(--primary);
    }

    .amount-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .amount-val {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      margin-bottom: 4px;
    }

    .amount-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .order-details {
      text-align: left;
      font-size: 0.9rem;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .detail-val {
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .btn-success {
      background-color: #10b981;
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    }

    .btn-success:hover {
      background-color: #059669;
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: #ef4444;
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
    }

    .btn-danger:hover {
      background-color: #dc2626;
      transform: translateY(-1px);
    }

    .simulator-badge {
      display: inline-block;
      background: #fffbeb;
      border: 1px solid #fef3c7;
      color: #d97706;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="payment-container">
    <div class="brand">
      <div class="brand-logo">RP</div>
      <div class="brand-text">Razorpay <span>Simulator</span></div>
    </div>

    <div class="simulator-badge">⚠️ Sandbox / Test Mode</div>

    <div class="amount-box">
      <div class="amount-val" id="amountVal">₹0.00</div>
      <div class="amount-label">Payment Amount</div>
    </div>

    <div class="order-details">
      <div class="detail-row">
        <span class="detail-label">Merchant</span>
        <span class="detail-val">Need2Done Bhongir</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Order ID</span>
        <span class="detail-val" id="orderIdVal">N2D10001</span>
      </div>
    </div>

    <button class="btn btn-success" onclick="simulateSuccess()">Simulate Success</button>
    <button class="btn btn-danger" onclick="simulateFailure()">Simulate Failure</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId') || 'DRAFT';
    const amount = parseFloat(urlParams.get('amount')) || 0.00;
    let botPhone = '15556349916'; // Default fallback

    document.getElementById('orderIdVal').innerText = orderId;
    document.getElementById('amountVal').innerText = `₹${amount.toFixed(2)}`;

    // Fetch products to retrieve botPhone dynamically
    async function loadBotConfig() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        if (data.success && data.bot_phone) {
          botPhone = data.bot_phone;
        }
      } catch (err) {
        console.error('Failed to load bot phone:', err);
      }
    }
    loadBotConfig();

    function simulateSuccess() {
      window.location.href = `https://wa.me/${botPhone}?text=PAY_SUCCESS_${orderId}`;
    }

    function simulateFailure() {
      window.location.href = `https://wa.me/${botPhone}?text=PAY_FAILED_${orderId}`;
    }
  </script>
</body>
</html>
