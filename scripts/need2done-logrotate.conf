# ============================================================
# Need2Done Production Logrotate Configuration
# Location on EC2: /etc/logrotate.d/need2done
# ============================================================

/need2done/app/Need2Done/backend/logs/*.log
/need2done/app/Need2Done/N2D_whatsapp_bot/logs/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0664 ubuntu ubuntu
}
