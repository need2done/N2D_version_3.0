<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N2D — Live Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
        #map { height: 75vh; width: 100%; border-radius: 0 0 1.5rem 1.5rem; }
        .header { padding: 1rem 1.5rem; background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); }
        .header h1 { font-size: 1.2rem; font-weight: 700; }
        .header p { font-size: 0.8rem; opacity: 0.8; }
        .status-bar { display: flex; justify-content: space-between; padding: 1rem 1.5rem; background: #1e293b; }
        .status-item { text-align: center; }
        .status-item .label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; }
        .status-item .value { font-size: 1rem; font-weight: 600; margin-top: 4px; }
        .expired-msg { text-align: center; padding: 4rem 2rem; }
        .expired-msg h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>📍 Need2Done — Live Tracking</h1>
        <p>Your helper is on the way!</p>
    </div>

    <div id="map"></div>

    <div class="status-bar">
        <div class="status-item">
            <div class="label">Status</div>
            <div class="value" id="statusText" style="color: #4ade80;">Loading...</div>
        </div>
        <div class="status-item">
            <div class="label">Last Update</div>
            <div class="value" id="lastUpdate">--</div>
        </div>
    </div>

    <div id="expiredContainer" style="display:none;" class="expired-msg">
        <h2>✅ Tracking ended</h2>
        <p>Order completed. Thank you for using Need2Done!</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // TODO[ENV_CHANGE]: BACKEND API URL
        // Update this for production deployment.
        // ==========================================
        const API_BASE = window.location.origin;
        const token = window.location.pathname.split('/track/')[1];

        if (!token) {
            document.body.innerHTML = '<div class="expired-msg"><h2>❌ Invalid tracking link</h2></div>';
        }

        const map = L.map('map').setView([17.5116, 78.8890], 14);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© <a href="https://server.arcgisonline.com" target="_blank" style="color:#4F46E5;font-weight:bold;">Esri HD Maps</a> | Need2Done',
            maxZoom: 19
        }).addTo(map);



        let marker = null;
        let polyline = null;

        async function fetchLocation() {
            try {
                const res = await fetch(`${API_BASE}/api/tracking/live/${token}`);
                const data = await res.json();

                if (data.status === 'EXPIRED') {
                    document.getElementById('map').style.display = 'none';
                    document.querySelector('.status-bar').style.display = 'none';
                    document.getElementById('expiredContainer').style.display = 'block';
                    return;
                }

                if (data.location) {
                    const { lat, lng, timestamp } = data.location;
                    const pos = [parseFloat(lat), parseFloat(lng)];

                    if (!marker) {
                        marker = L.marker(pos).addTo(map);
                    } else {
                        marker.setLatLng(pos);
                    }
                    map.panTo(pos);

                    // Draw trail as polyline (route line like Uber/Zomato)
                    if (data.trail && data.trail.length > 1) {
                        const trailCoords = data.trail.map(p => [parseFloat(p.lat), parseFloat(p.lng)]);
                        if (polyline) map.removeLayer(polyline);
                        polyline = L.polyline(trailCoords, {
                            color: '#4F46E5',
                            weight: 4,
                            opacity: 0.8
                        }).addTo(map);
                    }

                    document.getElementById('statusText').textContent = data.status;
                    document.getElementById('statusText').style.color = data.status === 'ACTIVE' ? '#4ade80' : '#f87171';

                    const ago = Math.floor((Date.now() - new Date(data.last_ping).getTime()) / 1000);
                    document.getElementById('lastUpdate').textContent = ago < 60 ? `${ago}s ago` : `${Math.floor(ago/60)}m ago`;
                }
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        // Poll every 10 seconds
        fetchLocation();
        setInterval(fetchLocation, 10000);
    </script>
</body>
</html>
