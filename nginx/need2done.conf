# ==========================================================
# Need2Done — Nginx Configuration
# ==========================================================
# Domain  : need2done.in
# Server  : AWS EC2 Ubuntu
#
# SETUP STEPS (run these on the EC2 server):
# ----------------------------------------------------------
# Step 1: Install Nginx
#   sudo apt update && sudo apt install -y nginx
#
# Step 2: Install Certbot for HTTPS (Let's Encrypt)
#   sudo apt install -y certbot python3-certbot-nginx
#
# Step 3: Copy this file to Nginx config directory
#   sudo cp /home/ubuntu/Need2Done/nginx/need2done.conf \
#            /etc/nginx/sites-available/need2done
#
# Step 4: Enable the site
#   sudo ln -s /etc/nginx/sites-available/need2done \
#               /etc/nginx/sites-enabled/need2done
#
# Step 5: Remove default Nginx site (if present)
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# Step 6: Test config is valid
#   sudo nginx -t
#
# Step 7: Get SSL certificate from Let's Encrypt
#   sudo certbot --nginx -d need2done.in -d www.need2done.in
#
# Step 8: Reload Nginx
#   sudo systemctl reload nginx
#
# Step 9: Enable Nginx to start on reboot
#   sudo systemctl enable nginx
# ==========================================================


# ----------------------------------------------------------
# HTTP → HTTPS Redirect
# ----------------------------------------------------------
# All HTTP (port 80) traffic is redirected to HTTPS.
# Let's Encrypt (certbot) will manage this block after setup.

server {
    listen 80;
    listen [::]:80;
    server_name need2done.in www.need2done.in;

    # Certbot will add its own ACME challenge location here.
    # For now, redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}


# ----------------------------------------------------------
# HTTPS Main Server Block
# ----------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name need2done.in www.need2done.in;

    # -------------------------------------------------------
    # SSL Certificates — Managed by Certbot (Let's Encrypt)
    # These paths are auto-populated by: certbot --nginx
    # -------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/need2done.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/need2done.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # -------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https: http:; font-src 'self' https: http: data:; frame-ancestors 'self';" always;


    # Max upload size (for media/image uploads)
    client_max_body_size 10M;


    # -------------------------------------------------------
    # ROUTE 1: WhatsApp Webhook
    # Meta sends webhooks to: https://need2done.in/webhook
    # Nginx forwards them to: http://127.0.0.1:5000/webhook
    # Node.js backend then forwards to bot on port 8000.
    # -------------------------------------------------------
    location /webhook {
        proxy_pass         http://127.0.0.1:5000/webhook;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow GET (Meta verification) and POST (incoming messages)
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------
    # ROUTE 2: REST API — Node.js Backend
    # All /api/* routes go to the Node.js backend on port 5000.
    # Example: https://need2done.in/api/orders → :5000/api/orders
    # -------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeout for long-running API calls
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------
    # ROUTE 3: Customer Tracking Page
    # https://need2done.in/track/TOKEN → Node.js (port 5000)
    # Node serves the live tracking HTML page.
    # -------------------------------------------------------
    location /track/ {
        proxy_pass         http://127.0.0.1:5000/track/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # ROUTE 4: App Deep Link Redirect
    # https://need2done.in/open-app?order_id=X → Node.js
    # -------------------------------------------------------
    location /open-app {
        proxy_pass         http://127.0.0.1:5000/open-app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # ROUTE 5: Sub-Module Dashboards
    # -------------------------------------------------------
    location /admin {
        root /need2done/app/Need2Done/website;
        try_files $uri $uri/ /admin/index.html;
    }

    location /food {
        root /need2done/app/Need2Done/website;
        try_files $uri $uri/ /food/index.html;
    }

    location /fruits {
        root /need2done/app/Need2Done/website;
        try_files $uri $uri/ /vegetables-fruits/index.html;
    }

    location /vegetables-fruits {
        root /need2done/app/Need2Done/website;
        try_files $uri $uri/ /vegetables-fruits/index.html;
    }

    location /groceries {
        root /need2done/app/Need2Done/website;
        try_files $uri $uri/ /groceries/index.html;
    }

    location /services {
        root /need2done/app/Need2Done/website;
        try_files $uri $uri/ /home-services/index.html;
    }





    # -------------------------------------------------------
    # ROUTE 6: Public Website (Marketing / Landing Page)
    # https://need2done.in → Static HTML/CSS/JS files
    # Files located at: /need2done/app/Need2Done/website/
    # -------------------------------------------------------
    location /uploads/ {
        alias /need2done/app/Need2Done/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        root /need2done/app/Need2Done/website;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # -------------------------------------------------------
    # Gzip Compression (reduces bandwidth)
    # -------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # -------------------------------------------------------
    # Access and Error Logs
    # -------------------------------------------------------
    access_log /var/log/nginx/need2done_access.log;
    error_log  /var/log/nginx/need2done_error.log warn;
}
